name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Portage derives its EPREFIX from sys.prefix. A pip-installed Portage
      # would otherwise reject "/" as <eroot>; an empty EPREFIX restores the
      # behaviour of a real Gentoo host.
      EPREFIX: ""
    strategy:
      matrix:
        go-version: ['stable']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Install Gentoo tooling
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends python3-venv bzip2 xz-utils
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip
        "$RUNNER_TEMP/venv/bin/pip" install portage pkgdev pycargoebuild
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test -v -race ./...

    - name: Run vet
      run: go vet ./...
